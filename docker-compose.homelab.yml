name: worldmonitor

services:
  worldmonitor:
    build:
      context: .
      dockerfile: Dockerfile
    image: worldmonitor-local:latest
    container_name: worldmonitor
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    ports:
      - "1400:8080"
    environment:
      UPSTASH_REDIS_REST_URL: "http://redis-rest:80"
      UPSTASH_REDIS_REST_TOKEN: "${REDIS_TOKEN:?REDIS_TOKEN required}"
      WM_SESSION_SECRET: "${WM_SESSION_SECRET:?WM_SESSION_SECRET required}"
      LOCAL_API_PORT: "46123"
      LOCAL_API_MODE: "docker"
      LOCAL_API_CLOUD_FALLBACK: "false"
      WM_TRUSTED_PROXY_CIDRS: "100.92.170.25/32"
      WS_RELAY_URL: "http://ais-relay:3004"
      WORLDMONITOR_VALID_KEYS: "${WORLDMONITOR_VALID_KEYS:-}"
      RELAY_SHARED_SECRET: "${RELAY_SHARED_SECRET:?RELAY_SHARED_SECRET required}"
      WORLDMONITOR_RELAY_KEY: "${WORLDMONITOR_RELAY_KEY:?WORLDMONITOR_RELAY_KEY required}"
      LLM_API_URL: "${LLM_API_URL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      AISSTREAM_API_KEY: "${AISSTREAM_API_KEY:-}"
      FINNHUB_API_KEY: "${FINNHUB_API_KEY:-}"
      ALPHA_VANTAGE_API_KEY: "${ALPHA_VANTAGE_API_KEY:-}"
      EIA_API_KEY: "${EIA_API_KEY:-}"
      FRED_API_KEY: "${FRED_API_KEY:-}"
      ACLED_EMAIL: "${ACLED_EMAIL:-}"
      ACLED_PASSWORD: "${ACLED_PASSWORD:-}"
      NASA_FIRMS_API_KEY: "${NASA_FIRMS_API_KEY:-}"
      AVIATIONSTACK_API: "${AVIATIONSTACK_API:-}"
    depends_on:
      - redis-rest
      - ais-relay
    restart: unless-stopped

  ais-relay:
    build:
      context: .
      dockerfile: Dockerfile.relay
    image: worldmonitor-ais-relay-local:latest
    container_name: worldmonitor-ais-relay
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    environment:
      RELAY_SHARED_SECRET: "${RELAY_SHARED_SECRET:?RELAY_SHARED_SECRET required}"
      AISSTREAM_API_KEY: "${AISSTREAM_API_KEY:-}"
      FINNHUB_API_KEY: "${FINNHUB_API_KEY:-}"
      MARKET_YAHOO_REFRESH_INTERVAL_MS: "900000"
      UPSTASH_REDIS_REST_URL: "http://redis-rest:80"
      UPSTASH_REDIS_REST_TOKEN: "${REDIS_TOKEN:?REDIS_TOKEN required}"
      UPSTASH_ALLOW_INSECURE_HTTP: "true"
      API_BASE_URL: "http://worldmonitor:8080"
      WORLDMONITOR_RELAY_KEY: "${WORLDMONITOR_RELAY_KEY:?WORLDMONITOR_RELAY_KEY required}"
      PORT: "3004"
    depends_on:
      - redis-rest
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: worldmonitor-redis
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD required}"
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - /opt/docker/worldmonitor/redis-data:/data
    restart: unless-stopped

  redis-rest:
    build:
      context: docker
      dockerfile: Dockerfile.redis-rest
    image: worldmonitor-redis-rest-local:latest
    container_name: worldmonitor-redis-rest
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    mem_limit: 512m
    environment:
      SRH_TOKEN: "${REDIS_TOKEN:?REDIS_TOKEN required}"
      SRH_CONNECTION_STRING: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379"
    depends_on:
      - redis
    restart: unless-stopped

  seeder:
    build:
      context: .
      dockerfile: Dockerfile.homelab-seeder
    image: worldmonitor-seeder-local:latest
    container_name: worldmonitor-seeder
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    environment:
      UPSTASH_REDIS_REST_URL: "http://redis-rest:80"
      REDIS_TOKEN: "${REDIS_TOKEN:?REDIS_TOKEN required}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      LLM_API_URL: "${LLM_API_URL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
      NASA_FIRMS_API_KEY: "${NASA_FIRMS_API_KEY:-}"
      AISSTREAM_API_KEY: "${AISSTREAM_API_KEY:-}"
      FRED_API_KEY: "${FRED_API_KEY:-}"
      FINNHUB_API_KEY: "${FINNHUB_API_KEY:-}"
      ALPHA_VANTAGE_API_KEY: "${ALPHA_VANTAGE_API_KEY:-}"
      EIA_API_KEY: "${EIA_API_KEY:-}"
      ACLED_EMAIL: "${ACLED_EMAIL:-}"
      ACLED_PASSWORD: "${ACLED_PASSWORD:-}"
      AVIATIONSTACK_API: "${AVIATIONSTACK_API:-}"
    depends_on:
      - redis-rest
    restart: unless-stopped
